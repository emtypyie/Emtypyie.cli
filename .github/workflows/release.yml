name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-node:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          echo "VTAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Cache pkg binaries
        uses: actions/cache@v4
        with:
          path: ~\.pkg-cache
          key: pkg-cache-${{ runner.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: archive/${{ steps.version.outputs.VTAG }}/Root4node
        run: npm ci

      - name: Build standalone executable (pkg)
        working-directory: archive/${{ steps.version.outputs.VTAG }}/Root4node
        run: npm run build

      - name: Package Windows x64 ZIP
        shell: pwsh
        run: |
          $vtag = "${{ steps.version.outputs.VTAG }}"
          $version = "${{ steps.version.outputs.VERSION }}"
          $src = "archive/$vtag/Root4node/dist/emtypyie.exe"
          $zip = "archive/$vtag/Root4node/dist/emtypyie-cli-windows-x64-$version.zip"
          Compress-Archive -Path $src -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  emtypyie-cli-windows-x64-$version.zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - name: Upload Node.js ZIP
        uses: actions/upload-artifact@v4
        with:
          name: node-build
          path: archive/${{ steps.version.outputs.VTAG }}/Root4node/dist/emtypyie-cli-windows-x64-${{ steps.version.outputs.VERSION }}.zip*
          if-no-files-found: error

  build-c:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          echo "VTAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up MSYS2 (mingw-w64 gcc/g++)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake

      - name: Build C native executable
        shell: msys2 {0}
        run: |
          cd "archive/${{ steps.version.outputs.VTAG }}/Root4c"
          SRC=src
          LIB=lib
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -I $SRC -I $LIB -c -o main.o $SRC/main.c
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -I $SRC -I $LIB -c -o shell.o $SRC/shell.c
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -I $SRC -I $LIB -c -o theme.o $SRC/theme.c
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -I $SRC -I $LIB -c -o util.o $SRC/util.c
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -I $SRC -I $LIB -c -o fetch.o $SRC/fetch.c
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -I $SRC -I $LIB -c -o download.o $SRC/download.c
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -I $SRC -I $LIB -c -o project.o $SRC/project.c
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -I $SRC -I $LIB -c -o bakafetch.o $SRC/bakafetch.c
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -I $SRC -I $LIB -c -o runtime.o $SRC/runtime.c
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -I $SRC -I $LIB -c -o auth.o $SRC/auth.c
          g++ -std=c++17 -Wall -Wextra -I $SRC -I $LIB -c -o larpino.o $SRC/larpino.cpp
          gcc -c -I $LIB -o cJSON.o $LIB/cJSON.c
          g++ -o emtypyie.exe main.o shell.o theme.o util.o fetch.o download.o project.o bakafetch.o runtime.o auth.o larpino.o cJSON.o -lwinhttp -lstdc++

      - name: Package native Windows x64 ZIP
        shell: pwsh
        run: |
          $vtag = "${{ steps.version.outputs.VTAG }}"
          $version = "${{ steps.version.outputs.VERSION }}"
          $src = "archive/$vtag/Root4c/emtypyie.exe"
          $zip = "archive/$vtag/Root4c/emtypyie-cli-native-windows-x64-$version.zip"
          Compress-Archive -Path $src -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  emtypyie-cli-native-windows-x64-$version.zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - name: Upload C native ZIP
        uses: actions/upload-artifact@v4
        with:
          name: c-build
          path: archive/${{ steps.version.outputs.VTAG }}/Root4c/emtypyie-cli-native-windows-x64-${{ steps.version.outputs.VERSION }}.zip*
          if-no-files-found: error

  create-release:
    needs: [build-node, build-c]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-build
          path: node-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: c-build
          path: c-artifacts

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            node-artifacts/*
            c-artifacts/*

      - name: Remove auto-generated source archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="Emtypyie.cli"
          gh release delete-asset "$TAG" "${REPO}-${TAG}.zip" --yes 2>/dev/null || true
          gh release delete-asset "$TAG" "${REPO}-${TAG}.tar.gz" --yes 2>/dev/null || true

  publish-npm:
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          echo "VTAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        working-directory: archive/${{ steps.version.outputs.VTAG }}/Root4node
        run: npm ci
      - name: Publish to npm
        working-directory: archive/${{ steps.version.outputs.VTAG }}/Root4node
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github-packages:
    needs: [build-node, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          echo "VTAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@emtypyie'
      - name: Set package scope
        working-directory: archive/${{ steps.version.outputs.VTAG }}/Root4node
        run: |
          node -e "const p=require('./package.json'); p.name='@emtypyie/emtypyie-cli'; require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: Install dependencies
        working-directory: archive/${{ steps.version.outputs.VTAG }}/Root4node
        run: npm ci
      - name: Publish to GitHub Packages
        working-directory: archive/${{ steps.version.outputs.VTAG }}/Root4node
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-winget:
    needs: build-c
    runs-on: windows-latest
    steps:
      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create winget manifest and submit PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGETCREATE_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $url = "https://github.com/emtypyie/Emtypyie.cli/releases/download/v$version/emtypyie-cli-windows-x64-$version.zip"
          $installerSha = ([System.Text.Encoding]::UTF8.GetString((Invoke-WebRequest -Uri "$url.sha256").Content)).Split(" ")[0].Trim()

          $base = "manifests/e/emtypyie/cli"

          $versionManifest = "PackageIdentifier: emtypyie.cli`nPackageVersion: $version`nDefaultLocale: en-US`nManifestType: version`nManifestVersion: 1.9.0"
          $installerManifest = "PackageIdentifier: emtypyie.cli`nPackageVersion: $version`nPlatform:`n- Windows.Desktop`nMinimumOSVersion: 10.0.17763.0`nInstallerType: zip`nInstallers:`n- Architecture: x64`n  InstallerUrl: $url`n  InstallerSha256: $installerSha`nManifestType: installer`nManifestVersion: 1.9.0"
          $localeManifest = "PackageIdentifier: emtypyie.cli`nPackageVersion: $version`nPackageLocale: en-US`nPublisher: emtypyie`nPackageName: emtypyie-cli`nShortDescription: Emtypyie CLI - Run emtypyie projects from your terminal with ease`nDescription: Emtypyie CLI allows you to create, manage, and run emtypyie projects directly from your terminal.`nLicense: Proprietary`nManifestType: defaultLocale`nManifestVersion: 1.9.0"

          $headers = @{ Authorization = "token $env:GH_TOKEN"; Accept = "application/vnd.github.v3+json" }
          $upstream = "microsoft/winget-pkgs"
          $fork = "emtypyie/winget-pkgs"
          $defaultBranch = (Invoke-RestMethod -Uri "https://api.github.com/repos/$upstream" -Headers $headers).default_branch
          $upstreamSha = (Invoke-RestMethod -Uri "https://api.github.com/repos/$upstream/git/ref/heads/$defaultBranch" -Headers $headers).object.sha

          try { Invoke-RestMethod -Uri "https://api.github.com/repos/$fork" -Headers $headers | Out-Null } catch {
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$upstream/forks" -Headers $headers | Out-Null
            Start-Sleep -Seconds 5
          }

          $tree = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$fork/git/trees" -Headers $headers -Body (@{
            base_tree = $upstreamSha
            tree = @(
              @{ path = "$base/emtypyie.cli.yaml"; content = $versionManifest; mode = "100644"; type = "blob" }
              @{ path = "$base/emtypyie.cli.installer.yaml"; content = $installerManifest; mode = "100644"; type = "blob" }
              @{ path = "$base/emtypyie.cli.locale.en-US.yaml"; content = $localeManifest; mode = "100644"; type = "blob" }
            )
          } | ConvertTo-Json -Depth 5 -Compress)

          $commit = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$fork/git/commits" -Headers $headers -Body (@{
            message = "Add emtypyie.cli v$version"; tree = $tree.sha; parents = @($upstreamSha)
          } | ConvertTo-Json -Compress)

          $branchName = "emtypyie-cli-v$version"
          try { Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$fork/git/refs/heads/$branchName" -Headers $headers -Body (@{ sha = $commit.sha; force = $true } | ConvertTo-Json -Compress) | Out-Null } catch {
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$fork/git/refs" -Headers $headers -Body (@{ ref = "refs/heads/$branchName"; sha = $commit.sha } | ConvertTo-Json -Compress) | Out-Null
          }

          $pr = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$upstream/pulls" -Headers $headers -Body (@{
            title = "Add emtypyie.cli v$version"; head = "emtypyie:$branchName"; base = $defaultBranch
            body = "Add emtypyie.cli v$version`n`n- Installer URL: $url`n- Installer SHA256: $installerSha`n- Installer Type: zip"
          } | ConvertTo-Json -Depth 5)

          Write-Host "PR created: $($pr.html_url)"
