name: Winget Submission

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 3.0.1)'
        required: true

permissions:
  contents: write

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get SHA from release asset
        id: sha
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $url = "https://github.com/emtypyie/Emtypyie.cli/releases/download/v$version/emtypyie-cli-windows-x64-$version.zip.sha256"
          $sha = ([System.Text.Encoding]::UTF8.GetString((Invoke-WebRequest -Uri $url).Content)).Split(" ")[0].Trim()
          "SHA256=$sha" | Out-File -FilePath "$env:GITHUB_ENV" -Append

      - name: Create winget manifest and submit PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGETCREATE_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $url = "https://github.com/emtypyie/Emtypyie.cli/releases/download/v$version/emtypyie-cli-windows-x64-$version.zip"
          $sha = $env:SHA256

          $base = "manifests/e/emtypyie/cli"

          $versionManifest = "PackageIdentifier: emtypyie.cli`nPackageVersion: $version`nDefaultLocale: en-US`nManifestType: version`nManifestVersion: 1.9.0"

          $installerManifest = "PackageIdentifier: emtypyie.cli`nPackageVersion: $version`nPlatform:`n- Windows.Desktop`nMinimumOSVersion: 10.0.17763.0`nInstallerType: zip`nInstallers:`n- Architecture: x64`n  InstallerUrl: $url`n  InstallerSha256: $sha`nManifestType: installer`nManifestVersion: 1.9.0"

          $localeManifest = "PackageIdentifier: emtypyie.cli`nPackageVersion: $version`nPackageLocale: en-US`nPublisher: emtypyie`nPackageName: emtypyie-cli`nShortDescription: Emtypyie CLI - Run emtypyie projects from your terminal with ease`nDescription: Emtypyie CLI allows you to create, manage, and run emtypyie projects directly from your terminal.`nLicense: Proprietary`nManifestType: defaultLocale`nManifestVersion: 1.9.0"

          $headers = @{
            Authorization = "token $env:GH_TOKEN"
            Accept = "application/vnd.github.v3+json"
          }

          $upstream = "microsoft/winget-pkgs"
          $fork = "emtypyie/winget-pkgs"
          $defaultBranch = (Invoke-RestMethod -Uri "https://api.github.com/repos/$upstream" -Headers $headers).default_branch
          $upstreamSha = (Invoke-RestMethod -Uri "https://api.github.com/repos/$upstream/git/ref/heads/$defaultBranch" -Headers $headers).object.sha

          try { Invoke-RestMethod -Uri "https://api.github.com/repos/$fork" -Headers $headers | Out-Null } catch {
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$upstream/forks" -Headers $headers | Out-Null
            Start-Sleep -Seconds 5
          }

          $tree = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$fork/git/trees" -Headers $headers -Body (@{
            base_tree = $upstreamSha
            tree = @(
              @{ path = "$base/emtypyie.cli.yaml"; content = $versionManifest; mode = "100644"; type = "blob" }
              @{ path = "$base/emtypyie.cli.installer.yaml"; content = $installerManifest; mode = "100644"; type = "blob" }
              @{ path = "$base/emtypyie.cli.locale.en-US.yaml"; content = $localeManifest; mode = "100644"; type = "blob" }
            )
          } | ConvertTo-Json -Depth 5 -Compress)

          $commit = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$fork/git/commits" -Headers $headers -Body (@{
            message = "Add emtypyie.cli v$version"
            tree = $tree.sha
            parents = @($upstreamSha)
          } | ConvertTo-Json -Compress)

          $branchName = "emtypyie-cli-v$version"
          try {
            Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$fork/git/refs/heads/$branchName" -Headers $headers -Body (@{ sha = $commit.sha; force = $true } | ConvertTo-Json -Compress) | Out-Null
          } catch {
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$fork/git/refs" -Headers $headers -Body (@{ ref = "refs/heads/$branchName"; sha = $commit.sha } | ConvertTo-Json -Compress) | Out-Null
          }

          $pr = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$upstream/pulls" -Headers $headers -Body (@{
            title = "Add emtypyie.cli v$version"
            head = "emtypyie:$branchName"
            base = $defaultBranch
            body = "Add emtypyie.cli v$version`n`n- Installer URL: $url`n- Installer SHA256: $sha`n- Installer Type: zip"
          } | ConvertTo-Json -Depth 5)

          Write-Host "PR created: $($pr.html_url)"
