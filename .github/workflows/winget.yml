name: Winget Submission

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 3.0.1)'
        required: true

permissions:
  contents: write

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get SHA from release asset
        id: sha
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $url = "https://github.com/emtypyie/Emtypyie.cli/releases/download/v$version/emtypyie-cli-windows-x64-$version.zip.sha256"
          $sha = ([System.Text.Encoding]::UTF8.GetString((Invoke-WebRequest -Uri $url).Content)).Split(" ")[0].Trim()
          "SHA256=$sha" | Out-File -FilePath "$env:GITHUB_ENV" -Append

      - name: Create winget manifest and submit PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGETCREATE_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $url = "https://github.com/emtypyie/Emtypyie.cli/releases/download/v$version/emtypyie-cli-windows-x64-$version.zip"
          $sha = $env:SHA256

          $versionManifest = @"
          PackageIdentifier: emtypyie.cli
          PackageVersion: $version
          DefaultLocale: en-US
          ManifestType: merged
          ManifestVersion: 1.9.0
          "@

          $installerManifest = @"
          PackageIdentifier: emtypyie.cli
          PackageVersion: $version
          Platform:
          - Windows.Desktop
          MinimumOSVersion: 10.0.17763.0
          InstallerType: zip
          Installers:
          - Architecture: x64
            InstallerUrl: $url
            InstallerSha256: $sha
          ManifestType: merged
          ManifestVersion: 1.9.0
          "@

          $localeManifest = @"
          PackageIdentifier: emtypyie.cli
          PackageVersion: $version
          PackageLocale: en-US
          Publisher: emtypyie
          PackageName: emtypyie-cli
          ShortDescription: Emtypyie CLI — Run emtypyie projects from your terminal with ease
          Description: |
            Emtypyie CLI allows you to create, manage, and run emtypyie projects directly from your terminal.
            Supports themes, bakafetch, runtime installation, and more.
          License: Proprietary
          ManifestType: merged
          ManifestVersion: 1.9.0
          "@

          $branch = "emtypyie.cli-$version"
          $base = "manifests/e/emtypyie/cli"

          $headers = @{
            Authorization = "token $env:GH_TOKEN"
            Accept = "application/vnd.github.v3+json"
          }

          $repo = "microsoft/winget-pkgs"
          $defaultBranch = (Invoke-RestMethod -Uri "https://api.github.com/repos/$repo" -Headers $headers).default_branch

          $sha = (Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/ref/heads/$defaultBranch" -Headers $headers).object.sha

          $tree = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/git/trees" -Headers $headers -Body (@{
            base_tree = $sha
            tree = @(
              @{ path = "$base/emtypyie.cli.yaml"; content = $versionManifest; mode = "100644"; type = "blob" }
              @{ path = "$base/emtypyie.cli.installer.yaml"; content = $installerManifest; mode = "100644"; type = "blob" }
              @{ path = "$base/emtypyie.cli.locale.en-US.yaml"; content = $localeManifest; mode = "100644"; type = "blob" }
            )
          } | ConvertTo-Json -Depth 5 -Compress)

          $commit = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/git/commits" -Headers $headers -Body (@{
            message = "Add emtypyie.cli v$version"
            tree = $tree.sha
            parents = @($sha)
          } | ConvertTo-Json -Compress)

          $created = $false
          try {
            Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$repo/git/refs/heads/$branch" -Headers $headers -Body (@{
              sha = $commit.sha
              force = $true
            } | ConvertTo-Json -Compress)
            $created = $true
          } catch {}

          if (-not $created) {
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/git/refs" -Headers $headers -Body (@{
              ref = "refs/heads/$branch"
              sha = $commit.sha
            } | ConvertTo-Json -Compress)
          }

          $pr = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/pulls" -Headers $headers -Body (@{
            title = "Add emtypyie.cli v$version"
            head = $branch
            base = $defaultBranch
            body = @"
          ## emtypyie.cli v$version

          - **Package Identifier**: emtypyie.cli
          - **Version**: $version
          - **Installer URL**: $url
          - **Installer SHA256**: $sha
          - **Installer Type**: zip

          Auto-submitted by Emtypyie.cli release workflow.
          "@
          } | ConvertTo-Json -Depth 5)

          Write-Host "PR created: $($pr.html_url)"
